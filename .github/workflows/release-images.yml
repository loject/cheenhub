name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: "1.92.0"
  DIOXUS_CLI_VERSION: "0.7.5"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  CHEENHUB_DOMAIN: ${{ vars.CHEENHUB_DOMAIN || 'cheenhub.ru' }}
  CHEENHUB_BASE_URL: ${{ vars.CHEENHUB_BASE_URL || 'https://cheenhub.ru' }}
  CHEENHUB_REALTIME_CERT_SHA256: ${{ vars.CHEENHUB_REALTIME_CERT_SHA256 || '' }}
  CHEENHUB_JWT_KEY_ID: ${{ vars.CHEENHUB_JWT_KEY_ID || 'prod-ed25519-1' }}
  CHEENHUB_JWT_PUBLIC_KEY_BASE64: ${{ vars.CHEENHUB_JWT_PUBLIC_KEY_BASE64 || '' }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      web-image: ${{ steps.images.outputs.web }}
      app-version: ${{ steps.app-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repo}/backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repo}/web" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        id: app-version
        shell: bash
        run: |
          release_tag="$(cargo run --quiet -p xtask -- release-version print-tag)"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${release_tag}"
            if [[ "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
              echo "Release tag ${GITHUB_REF_NAME} must match workspace version ${release_tag}." >&2
              exit 1
            fi
          else
            version="${release_tag}-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        shell: bash
        run: |
          if [[ -z "${CHEENHUB_JWT_PUBLIC_KEY_BASE64}" ]]; then
            echo "CHEENHUB_JWT_PUBLIC_KEY_BASE64 repository variable is required for production frontend builds." >&2
            exit 1
          fi

  build-backend:
    name: Build and push backend image
    runs-on: ubuntu-24.04
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.backend-image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backend-runtime
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.backend-image }}:buildcache
            type=registry,ref=${{ needs.prepare.outputs.web-image }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.backend-image }}:buildcache,mode=max

      - name: Export backend release image archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist/backend
          docker pull "${{ needs.prepare.outputs.backend-image }}:${GITHUB_REF_NAME}"
          docker save "${{ needs.prepare.outputs.backend-image }}:${GITHUB_REF_NAME}" | gzip -9 > "dist/backend/cheenhub-backend-${GITHUB_REF_NAME}.docker-image.tar.gz"

      - name: Publish backend release archive
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: cargo run --quiet -p xtask -- release-artifacts publish "${GITHUB_REF_NAME}" dist/backend

  build-web:
    name: Build and push web image
    runs-on: ubuntu-24.04
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.web-image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web-runtime
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            CHEENHUB_BASE_URL=${{ env.CHEENHUB_BASE_URL }}
            CHEENHUB_APP_VERSION=${{ needs.prepare.outputs.app-version }}
            CHEENHUB_JWT_KEY_ID=${{ env.CHEENHUB_JWT_KEY_ID }}
            CHEENHUB_JWT_PUBLIC_KEY_BASE64=${{ env.CHEENHUB_JWT_PUBLIC_KEY_BASE64 }}
            CHEENHUB_REALTIME_CERT_SHA256=${{ env.CHEENHUB_REALTIME_CERT_SHA256 }}
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.web-image }}:buildcache
            type=registry,ref=${{ needs.prepare.outputs.backend-image }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.web-image }}:buildcache,mode=max

      - name: Export web release image archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist/web
          docker pull "${{ needs.prepare.outputs.web-image }}:${GITHUB_REF_NAME}"
          docker save "${{ needs.prepare.outputs.web-image }}:${GITHUB_REF_NAME}" | gzip -9 > "dist/web/cheenhub-web-${GITHUB_REF_NAME}.docker-image.tar.gz"

      - name: Publish web release archive
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: cargo run --quiet -p xtask -- release-artifacts publish "${GITHUB_REF_NAME}" dist/web

  build-windows-client:
    name: Build Windows client installers
    runs-on: windows-2025
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/')
    env:
      CHEENHUB_APP_VERSION: ${{ needs.prepare.outputs.app-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN

      - name: Cache Rust and Dioxus build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-client-release
          cache-on-failure: true
          cache-workspace-crates: true
          workspaces: |
            . -> target
          cache-directories: |
            target/dx

      - name: Cache Dioxus CLI
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/dx
            ~/.cargo/bin/dx.exe
          key: ${{ runner.os }}-dioxus-cli-${{ env.DIOXUS_CLI_VERSION }}

      - name: Install Dioxus CLI
        shell: pwsh
        run: |
          $dx = Get-Command dx -ErrorAction SilentlyContinue
          $expected = [regex]::Escape("dioxus $env:DIOXUS_CLI_VERSION")
          if ($dx -and ((dx --version) -match $expected)) {
            dx --version
          } else {
            cargo install dioxus-cli --version $env:DIOXUS_CLI_VERSION --locked
          }

      - name: Validate release version
        shell: pwsh
        run: cargo run --quiet -p xtask -- release-version check

      - name: Build Windows installers
        shell: pwsh
        run: |
          dx bundle --windows --package cheenhub_client --bin cheen_hub --release --no-default-features --features desktop,windows --package-types nsis --out-dir dist/windows/raw
          $payload = Get-ChildItem -Path dist/windows/raw -Recurse -Filter *.exe | Sort-Object FullName | Select-Object -First 1
          if (-not $payload) {
            throw "Dioxus Windows NSIS installer was not found in dist/windows/raw."
          }
          $env:CHEENHUB_INSTALLER_PAYLOAD = $payload.FullName
          $env:CHEENHUB_INSTALLER_PAYLOAD_NAME = $payload.Name
          cargo build -p cheenhub_client --bin cheenhub_installer --release --no-default-features --features desktop,windows
          New-Item -ItemType Directory -Force dist/windows/installer | Out-Null
          Copy-Item target/release/cheenhub_installer.exe dist/windows/installer/cheenhub-installer.exe

      - name: Normalize Windows release assets
        shell: pwsh
        run: |
          cargo run --quiet -p xtask -- release-artifacts collect windows dist/windows/installer dist/client $env:GITHUB_REF_NAME

      - name: Publish Windows release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: cargo run --quiet -p xtask -- release-artifacts publish $env:GITHUB_REF_NAME dist/client

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v6
        with:
          name: client-release-windows
          path: dist/client/*
          if-no-files-found: error

  build-linux-client:
    name: Build Linux client packages
    runs-on: ubuntu-24.04
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/')
    env:
      CHEENHUB_APP_VERSION: ${{ needs.prepare.outputs.app-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux bundle dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libfuse2t64 \
            libglib2.0-dev \
            libgtk-3-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache Cargo downloads and Dioxus CLI
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/dx
            ~/.cargo/bin/dx.exe
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-dioxus-${{ env.DIOXUS_CLI_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dioxus-${{ env.DIOXUS_CLI_VERSION }}-
            ${{ runner.os }}-cargo-dioxus-

      - name: Install Dioxus CLI
        shell: bash
        run: |
          if command -v dx >/dev/null 2>&1 && dx --version | grep -F "dioxus ${DIOXUS_CLI_VERSION}" >/dev/null; then
            dx --version
          else
            cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          fi

      - name: Validate release version
        shell: bash
        run: cargo run --quiet -p xtask -- release-version check

      - name: Build Linux packages
        shell: bash
        run: |
          dx bundle --linux --package cheenhub_client --bin cheen_hub --release --no-default-features --features desktop,linux --package-types deb --package-types appimage --out-dir dist/linux/raw

      - name: Normalize Linux release assets
        shell: bash
        run: |
          cargo run --quiet -p xtask -- release-artifacts collect linux dist/linux/raw dist/client "${GITHUB_REF_NAME}"

      - name: Publish Linux release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: cargo run --quiet -p xtask -- release-artifacts publish "${GITHUB_REF_NAME}" dist/client

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v6
        with:
          name: client-release-linux
          path: dist/client/*
          if-no-files-found: error

  build-android-client:
    name: Build Android client APK
    runs-on: ubuntu-24.04
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/')
    env:
      CHEENHUB_APP_VERSION: ${{ needs.prepare.outputs.app-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"
          ndk_path="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Cache Cargo downloads and Dioxus CLI
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/dx
            ~/.cargo/bin/dx.exe
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-dioxus-${{ env.DIOXUS_CLI_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dioxus-${{ env.DIOXUS_CLI_VERSION }}-
            ${{ runner.os }}-cargo-dioxus-

      - name: Install Dioxus CLI
        shell: bash
        run: |
          if command -v dx >/dev/null 2>&1 && dx --version | grep -F "dioxus ${DIOXUS_CLI_VERSION}" >/dev/null; then
            dx --version
          else
            cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          fi

      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          signing_keystore_dir="${GITHUB_WORKSPACE}/target/android-signing"
          mkdir -p "${signing_keystore_dir}"

          missing_secrets=()
          for secret_name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!secret_name}" ]]; then
              missing_secrets+=("${secret_name}")
            fi
          done

          if [[ "${#missing_secrets[@]}" -gt 0 ]]; then
            echo "Android release signing requires all permanent secrets. Missing: ${missing_secrets[*]}." >&2
            exit 1
          fi

          signing_keystore_path="${signing_keystore_dir}/release.p12"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${signing_keystore_path}"

          chmod 600 "${signing_keystore_path}"

          python3 - <<'PY'
          import json
          import os

          with open("Dioxus.toml", "a", encoding="utf-8") as config:
              config.write("\n[bundle.android]\n")
              config.write('jks_file = "target/android-signing/release.p12"\n')
              config.write(f"jks_password = {json.dumps(os.environ['ANDROID_RELEASE_KEYSTORE_PASSWORD'])}\n")
              config.write(f"key_alias = {json.dumps(os.environ['ANDROID_RELEASE_KEY_ALIAS'])}\n")
              config.write(f"key_password = {json.dumps(os.environ['ANDROID_RELEASE_KEY_PASSWORD'])}\n")
          PY

      - name: Validate release version
        shell: bash
        run: cargo run --quiet -p xtask -- release-version check

      - name: Resolve Android version metadata
        shell: bash
        run: |
          set -euo pipefail

          version_name="${CHEENHUB_APP_VERSION#v}"
          if [[ ! "${version_name}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Android version must contain exactly three numeric segments: ${version_name}." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          for segment in "${major}" "${minor}" "${patch}"; do
            if (( 10#${segment} > 999 )); then
              echo "Every Android version segment must be between 0 and 999: ${version_name}." >&2
              exit 1
            fi
          done

          version_code=$((10#${major} * 1000000 + 10#${minor} * 1000 + 10#${patch}))
          if (( version_code == 0 )); then
            echo "Android versionCode must be positive." >&2
            exit 1
          fi

          echo "ANDROID_VERSION_NAME=${version_name}" >> "${GITHUB_ENV}"
          echo "ANDROID_VERSION_CODE=${version_code}" >> "${GITHUB_ENV}"

      - name: Build APK package
        shell: bash
        run: |
          set -euo pipefail

          dx bundle \
            --android \
            --target aarch64-linux-android \
            --package cheenhub_client \
            --bin cheen_hub \
            --release \
            --no-default-features \
            --features mobile \
            --package-types apk \
            --out-dir dist/android/dioxus

          generated_android_root="target/dx/cheen_hub/release/android/app"
          generated_gradle_file="${generated_android_root}/app/build.gradle.kts"
          if [[ ! -f "${generated_gradle_file}" ]]; then
            echo "Generated Android Gradle file was not found: ${generated_gradle_file}." >&2
            exit 1
          fi

          export GENERATED_ANDROID_GRADLE_FILE="${generated_gradle_file}"
          python3 - <<'PY'
          import os
          from pathlib import Path

          gradle_file = Path(os.environ["GENERATED_ANDROID_GRADLE_FILE"])
          contents = gradle_file.read_text(encoding="utf-8")
          old = "versionCode = 1"
          replacement = f"versionCode = {os.environ['ANDROID_VERSION_CODE']}"
          if contents.count(old) != 1:
              raise SystemExit(
                  f"Expected exactly one {old!r} in {gradle_file}, "
                  f"found {contents.count(old)}."
              )
          gradle_file.write_text(contents.replace(old, replacement, 1), encoding="utf-8")
          PY

          chmod +x "${generated_android_root}/gradlew"
          (
            cd "${generated_android_root}"
            ./gradlew --no-daemon assembleRelease
          )

          generated_release_apk="${generated_android_root}/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "${generated_release_apk}" ]]; then
            echo "Gradle release APK was not found: ${generated_release_apk}." >&2
            exit 1
          fi

          release_dir="dist/android/release"
          if [[ -e "${release_dir}" ]]; then
            echo "Android release output directory must be clean: ${release_dir}." >&2
            exit 1
          fi
          mkdir -p "${release_dir}"
          cp "${generated_release_apk}" "${release_dir}/app-release.apk"

      - name: Validate Android release APK
        shell: bash
        run: |
          set -euo pipefail

          apk_path="dist/android/release/app-release.apk"
          aapt_path="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/aapt"
          apksigner_path="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner"

          for tool_path in "${aapt_path}" "${apksigner_path}"; do
            if [[ ! -x "${tool_path}" ]]; then
              echo "Required Android verification tool is unavailable: ${tool_path}." >&2
              exit 1
            fi
          done

          badging="$("${aapt_path}" dump badging "${apk_path}")"
          package_line="${badging%%$'\n'*}"
          if [[ "${package_line}" != *"name='ru.cheenhub'"* ]]; then
            echo "Unexpected Android package metadata: ${package_line}." >&2
            exit 1
          fi
          if [[ "${package_line}" != *"versionName='${ANDROID_VERSION_NAME}'"* ]]; then
            echo "Android versionName does not match ${ANDROID_VERSION_NAME}: ${package_line}." >&2
            exit 1
          fi
          if [[ "${package_line}" != *"versionCode='${ANDROID_VERSION_CODE}'"* ]]; then
            echo "Android versionCode does not match ${ANDROID_VERSION_CODE}: ${package_line}." >&2
            exit 1
          fi
          if [[ "${badging}" == *"application-debuggable"* ]]; then
            echo "Android release APK is marked as debuggable." >&2
            exit 1
          fi

          signature_report="$("${apksigner_path}" verify --verbose --print-certs "${apk_path}")"
          if [[ "${signature_report}" == *"Android Debug"* ]]; then
            echo "Android release APK is signed with an Android Debug certificate." >&2
            exit 1
          fi
          printf '%s\n' "${package_line}" "${signature_report}"

      - name: Normalize Android release asset
        shell: bash
        run: |
          cargo run --quiet -p xtask -- release-artifacts collect android dist/android/release dist/client "${GITHUB_REF_NAME}"

      - name: Publish Android release asset
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: cargo run --quiet -p xtask -- release-artifacts publish "${GITHUB_REF_NAME}" dist/client

      - name: Upload Android release asset
        uses: actions/upload-artifact@v6
        with:
          name: client-release-android
          path: dist/client/*
          if-no-files-found: error
