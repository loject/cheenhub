name: Release artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: "1.97.1"
  DIOXUS_CLI_VERSION: "0.8.0-alpha.1"
  DIOXUS_WINDOWS_SHA256: "d9bc14313d3f89b2357624810d41010c256ec70f08b24b9a0c0350595b5894d8"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  CHEENHUB_DOMAIN: ${{ vars.CHEENHUB_DOMAIN || 'cheenhub.ru' }}
  CHEENHUB_BASE_URL: ${{ vars.CHEENHUB_BASE_URL || 'https://cheenhub.ru' }}
  CHEENHUB_REALTIME_CERT_SHA256: ${{ vars.CHEENHUB_REALTIME_CERT_SHA256 || '' }}
  CHEENHUB_JWT_KEY_ID: ${{ vars.CHEENHUB_JWT_KEY_ID || 'prod-ed25519-1' }}
  CHEENHUB_JWT_PUBLIC_KEY_BASE64: ${{ vars.CHEENHUB_JWT_PUBLIC_KEY_BASE64 || '' }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      web-image: ${{ steps.images.outputs.web }}
      app-version: ${{ steps.app-version.outputs.version }}
      release-tag: ${{ steps.app-version.outputs.release-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repo}/backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repo}/web" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        id: app-version
        shell: bash
        run: |
          release_tag="$(cargo run --quiet -p xtask -- release-version print-tag)"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${release_tag}"
            artifact_tag="${GITHUB_REF_NAME}"
            if [[ "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
              echo "Release tag ${GITHUB_REF_NAME} must match workspace version ${release_tag}." >&2
              exit 1
            fi
          else
            version="${release_tag}-${GITHUB_SHA::7}"
            artifact_tag="dev"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release-tag=${artifact_tag}" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        shell: bash
        run: |
          if [[ -z "${CHEENHUB_JWT_PUBLIC_KEY_BASE64}" ]]; then
            echo "CHEENHUB_JWT_PUBLIC_KEY_BASE64 repository variable is required for production frontend builds." >&2
            exit 1
          fi

  build-backend:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    name: Build and push backend image
    runs-on: ubuntu-24.04
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.backend-image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backend-runtime
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.backend-image }}:buildcache
            type=registry,ref=${{ needs.prepare.outputs.web-image }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.backend-image }}:buildcache,mode=max

      - name: Export backend release image archive
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          mkdir -p dist/backend
          docker pull "${{ needs.prepare.outputs.backend-image }}:${GITHUB_REF_NAME}"
          docker save "${{ needs.prepare.outputs.backend-image }}:${GITHUB_REF_NAME}" | gzip -9 > "dist/backend/cheenhub-backend-${{ needs.prepare.outputs.release-tag }}.docker-image.tar.gz"

      - name: Publish backend release archive
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: cargo run --quiet -p xtask -- release-artifacts publish "${GITHUB_REF_NAME}" dist/backend

      - name: Upload backend release archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: backend-release-image
          path: dist/backend/*
          if-no-files-found: error

  build-web:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    name: Build and push web image
    runs-on: ubuntu-24.04
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.web-image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web-runtime
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            CHEENHUB_BASE_URL=${{ env.CHEENHUB_BASE_URL }}
            CHEENHUB_APP_VERSION=${{ needs.prepare.outputs.app-version }}
            CHEENHUB_JWT_KEY_ID=${{ env.CHEENHUB_JWT_KEY_ID }}
            CHEENHUB_JWT_PUBLIC_KEY_BASE64=${{ env.CHEENHUB_JWT_PUBLIC_KEY_BASE64 }}
            CHEENHUB_REALTIME_CERT_SHA256=${{ env.CHEENHUB_REALTIME_CERT_SHA256 }}
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.web-image }}:buildcache
            type=registry,ref=${{ needs.prepare.outputs.backend-image }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.web-image }}:buildcache,mode=max

      - name: Export web release image archive
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          mkdir -p dist/web
          docker pull "${{ needs.prepare.outputs.web-image }}:${GITHUB_REF_NAME}"
          docker save "${{ needs.prepare.outputs.web-image }}:${GITHUB_REF_NAME}" | gzip -9 > "dist/web/cheenhub-web-${{ needs.prepare.outputs.release-tag }}.docker-image.tar.gz"

      - name: Publish web release archive
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: cargo run --quiet -p xtask -- release-artifacts publish "${GITHUB_REF_NAME}" dist/web

      - name: Upload web release archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: web-release-image
          path: dist/web/*
          if-no-files-found: error

  build-windows-client:
    name: Build Windows client installers
    runs-on: windows-2025
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    env:
      CHEENHUB_APP_VERSION: ${{ needs.prepare.outputs.app-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN

      - name: Cache Rust and Dioxus build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-client-release-dx-0.8
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          cache-workspace-crates: true
          workspaces: |
            . -> target
          cache-directories: |
            target/dx

      - name: Install Dioxus CLI from official release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'dx-windows.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'dioxus-cli'
          $url = "https://github.com/DioxusLabs/dioxus/releases/download/v$env:DIOXUS_CLI_VERSION/dx-x86_64-pc-windows-msvc.zip"
          Write-Host "Downloading Dioxus CLI $env:DIOXUS_CLI_VERSION for Windows x64"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:DIOXUS_WINDOWS_SHA256) {
            throw "Dioxus CLI archive SHA256 mismatch: expected $env:DIOXUS_WINDOWS_SHA256, received $actual."
          }
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $binary = @(Get-ChildItem -Path $destination -Recurse -Filter dx.exe)
          if ($binary.Count -ne 1) {
            throw "Expected exactly one dx.exe in the official Dioxus archive."
          }
          $version = & $binary[0].FullName --version
          $expectedVersion = '^dioxus ' + [regex]::Escape($env:DIOXUS_CLI_VERSION) + '(?: \([^)]*\))?$'
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -notmatch $expectedVersion) {
            throw "Unexpected Dioxus CLI version: $version"
          }
          Write-Host $version
          $binary[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate release version
        shell: pwsh
        run: cargo run --quiet -p xtask -- release-version check

      - name: Build Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dx bundle --windows --target x86_64-pc-windows-msvc --package cheenhub_client --bin cheen_hub --release --no-default-features --features desktop,windows --package-types nsis --out-dir dist/windows/raw
          if ($LASTEXITCODE -ne 0) { throw "Windows Dioxus bundle failed." }
          $payload = Get-ChildItem -Path dist/windows/raw -Recurse -Filter *.exe | Sort-Object FullName | Select-Object -First 1
          if (-not $payload) {
            throw "Dioxus Windows NSIS installer was not found in dist/windows/raw."
          }
          $env:CHEENHUB_INSTALLER_PAYLOAD = $payload.FullName
          $env:CHEENHUB_INSTALLER_PAYLOAD_NAME = $payload.Name
          # Совпадение target и профиля с dx позволяет повторно использовать внешние зависимости.
          cargo build -p cheenhub_client --bin cheenhub_installer --target x86_64-pc-windows-msvc --profile desktop-release --config 'profile.desktop-release.inherits="release"' --config 'profile.desktop-release.strip=false' --no-default-features --features desktop,windows
          if ($LASTEXITCODE -ne 0) { throw "Windows installer wrapper build failed." }
          New-Item -ItemType Directory -Force dist/windows/installer | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/desktop-release/cheenhub_installer.exe dist/windows/installer/cheenhub-installer.exe

      - name: Normalize Windows release assets
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        run: |
          cargo run --quiet -p xtask -- release-artifacts collect windows dist/windows/installer dist/client "${{ needs.prepare.outputs.release-tag }}"

      - name: Publish Windows release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: cargo run --quiet -p xtask -- release-artifacts publish $env:GITHUB_REF_NAME dist/client

      - name: Upload Windows release assets
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v6
        with:
          name: client-release-windows
          path: dist/client/*
          if-no-files-found: error

  build-linux-client:
    name: Build Linux client packages
    runs-on: ubuntu-24.04
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CHEENHUB_APP_VERSION: ${{ needs.prepare.outputs.app-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux bundle dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libpulse-dev \
            libayatana-appindicator3-dev \
            libfuse2t64 \
            libglib2.0-dev \
            libgtk-3-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache Cargo downloads and Dioxus CLI
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/dx
            ~/.cargo/bin/dx.exe
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-dioxus-${{ env.DIOXUS_CLI_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dioxus-${{ env.DIOXUS_CLI_VERSION }}-
            ${{ runner.os }}-cargo-dioxus-

      - name: Install Dioxus CLI
        shell: bash
        run: |
          if command -v dx >/dev/null 2>&1 && dx --version | grep -F "dioxus ${DIOXUS_CLI_VERSION}" >/dev/null; then
            dx --version
          else
            cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          fi

      - name: Validate release version
        shell: bash
        run: cargo run --quiet -p xtask -- release-version check

      - name: Build Linux packages
        shell: bash
        run: |
          dx bundle --linux --package cheenhub_client --bin cheen_hub --release --no-default-features --features desktop,linux --package-types deb --package-types appimage --out-dir dist/linux/raw

      - name: Normalize Linux release assets
        shell: bash
        run: |
          cargo run --quiet -p xtask -- release-artifacts collect linux dist/linux/raw dist/client "${{ needs.prepare.outputs.release-tag }}"

      - name: Publish Linux release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: cargo run --quiet -p xtask -- release-artifacts publish "${GITHUB_REF_NAME}" dist/client

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v6
        with:
          name: client-release-linux
          path: dist/client/*
          if-no-files-found: error

  build-android-client:
    name: Build Android client APK
    runs-on: ubuntu-24.04
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CHEENHUB_APP_VERSION: ${{ needs.prepare.outputs.app-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"
          ndk_path="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Cache Cargo downloads and Dioxus CLI
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/dx
            ~/.cargo/bin/dx.exe
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-dioxus-${{ env.DIOXUS_CLI_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dioxus-${{ env.DIOXUS_CLI_VERSION }}-
            ${{ runner.os }}-cargo-dioxus-

      - name: Install Dioxus CLI
        shell: bash
        run: |
          if command -v dx >/dev/null 2>&1 && dx --version | grep -F "dioxus ${DIOXUS_CLI_VERSION}" >/dev/null; then
            dx --version
          else
            cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          fi

      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          signing_keystore_dir="${GITHUB_WORKSPACE}/target/android-signing"
          mkdir -p "${signing_keystore_dir}"

          missing_secrets=()
          for secret_name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!secret_name}" ]]; then
              missing_secrets+=("${secret_name}")
            fi
          done

          if [[ "${#missing_secrets[@]}" -gt 0 ]]; then
            echo "Android release signing requires all permanent secrets. Missing: ${missing_secrets[*]}." >&2
            exit 1
          fi

          signing_keystore_path="${signing_keystore_dir}/release.p12"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${signing_keystore_path}"

          chmod 600 "${signing_keystore_path}"

          python3 - <<'PY'
          import json
          import os

          with open("Dioxus.toml", "a", encoding="utf-8") as config:
              config.write("\n[bundle.android]\n")
              config.write('jks_file = "target/android-signing/release.p12"\n')
              config.write(f"jks_password = {json.dumps(os.environ['ANDROID_RELEASE_KEYSTORE_PASSWORD'])}\n")
              config.write(f"key_alias = {json.dumps(os.environ['ANDROID_RELEASE_KEY_ALIAS'])}\n")
              config.write(f"key_password = {json.dumps(os.environ['ANDROID_RELEASE_KEY_PASSWORD'])}\n")
          PY

      - name: Validate release version
        shell: bash
        run: cargo run --quiet -p xtask -- release-version check

      - name: Resolve Android version metadata
        shell: bash
        run: |
          set -euo pipefail

          version_name="${CHEENHUB_APP_VERSION#v}"
          if [[ ! "${version_name}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9a-f]{7})?$ ]]; then
            echo "Android version must contain three numeric segments and an optional commit suffix: ${version_name}." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          for segment in "${major}" "${minor}" "${patch}"; do
            if (( 10#${segment} > 999 )); then
              echo "Every Android version segment must be between 0 and 999: ${version_name}." >&2
              exit 1
            fi
          done

          version_code=$((10#${major} * 1000000 + 10#${minor} * 1000 + 10#${patch}))
          if (( version_code == 0 )); then
            echo "Android versionCode must be positive." >&2
            exit 1
          fi

          echo "ANDROID_VERSION_NAME=${version_name}" >> "${GITHUB_ENV}"
          echo "ANDROID_VERSION_CODE=${version_code}" >> "${GITHUB_ENV}"

      - name: Build APK package
        shell: bash
        run: |
          set -euo pipefail

          dx bundle \
            --android \
            --target aarch64-linux-android \
            --package cheenhub_client \
            --bin cheen_hub \
            --release \
            --no-default-features \
            --features mobile \
            --package-types apk \
            --out-dir dist/android/dioxus

          generated_android_root="target/dx/cheen_hub/release/android/app"
          generated_gradle_file="${generated_android_root}/app/build.gradle.kts"
          if [[ ! -f "${generated_gradle_file}" ]]; then
            echo "Generated Android Gradle file was not found: ${generated_gradle_file}." >&2
            exit 1
          fi

          export GENERATED_ANDROID_GRADLE_FILE="${generated_gradle_file}"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          gradle_file = Path(os.environ["GENERATED_ANDROID_GRADLE_FILE"])
          contents = gradle_file.read_text(encoding="utf-8")
          version_code = "versionCode = 1"
          version_code_replacement = f"versionCode = {os.environ['ANDROID_VERSION_CODE']}"
          if contents.count(version_code) != 1:
              raise SystemExit(
                  f"Expected exactly one {version_code!r} in {gradle_file}, "
                  f"found {contents.count(version_code)}."
              )
          contents = contents.replace(version_code, version_code_replacement, 1)

          version_name_pattern = r'versionName = "[^"]+"'
          version_name_matches = re.findall(version_name_pattern, contents)
          if len(version_name_matches) != 1:
              raise SystemExit(
                  f"Expected exactly one Android versionName in {gradle_file}, "
                  f"found {len(version_name_matches)}."
              )
          version_name_replacement = (
              f"versionName = {json.dumps(os.environ['ANDROID_VERSION_NAME'])}"
          )
          contents = re.sub(
              version_name_pattern,
              version_name_replacement,
              contents,
              count=1,
          )
          gradle_file.write_text(contents, encoding="utf-8")
          PY

          chmod +x "${generated_android_root}/gradlew"
          (
            cd "${generated_android_root}"
            ./gradlew --no-daemon assembleRelease
          )

          generated_release_apk="${generated_android_root}/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "${generated_release_apk}" ]]; then
            echo "Gradle release APK was not found: ${generated_release_apk}." >&2
            exit 1
          fi

          release_dir="dist/android/release"
          if [[ -e "${release_dir}" ]]; then
            echo "Android release output directory must be clean: ${release_dir}." >&2
            exit 1
          fi
          mkdir -p "${release_dir}"
          cp "${generated_release_apk}" "${release_dir}/app-release.apk"

      - name: Validate Android release APK
        shell: bash
        run: |
          set -euo pipefail

          apk_path="dist/android/release/app-release.apk"
          aapt_path="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/aapt"
          apksigner_path="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner"

          for tool_path in "${aapt_path}" "${apksigner_path}"; do
            if [[ ! -x "${tool_path}" ]]; then
              echo "Required Android verification tool is unavailable: ${tool_path}." >&2
              exit 1
            fi
          done

          badging="$("${aapt_path}" dump badging "${apk_path}")"
          package_line="${badging%%$'\n'*}"
          if [[ "${package_line}" != *"name='ru.cheenhub'"* ]]; then
            echo "Unexpected Android package metadata: ${package_line}." >&2
            exit 1
          fi
          if [[ "${package_line}" != *"versionName='${ANDROID_VERSION_NAME}'"* ]]; then
            echo "Android versionName does not match ${ANDROID_VERSION_NAME}: ${package_line}." >&2
            exit 1
          fi
          if [[ "${package_line}" != *"versionCode='${ANDROID_VERSION_CODE}'"* ]]; then
            echo "Android versionCode does not match ${ANDROID_VERSION_CODE}: ${package_line}." >&2
            exit 1
          fi
          if [[ "${badging}" == *"application-debuggable"* ]]; then
            echo "Android release APK is marked as debuggable." >&2
            exit 1
          fi

          signature_report="$("${apksigner_path}" verify --verbose --print-certs "${apk_path}")"
          if [[ "${signature_report}" == *"Android Debug"* ]]; then
            echo "Android release APK is signed with an Android Debug certificate." >&2
            exit 1
          fi
          printf '%s\n' "${package_line}" "${signature_report}"

      - name: Normalize Android release asset
        shell: bash
        run: |
          cargo run --quiet -p xtask -- release-artifacts collect android dist/android/release dist/client "${{ needs.prepare.outputs.release-tag }}"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v7
        with:
          name: client-release-android
          path: dist/client/*
          if-no-files-found: error

  publish-android-github:
    name: Publish Android APK to GitHub Release
    runs-on: ubuntu-24.04
    needs: build-android-client
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Download Android release artifact
        uses: actions/download-artifact@v8
        with:
          name: client-release-android
          path: dist/client

      - name: Publish Android release asset
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: cargo run --quiet -p xtask -- release-artifacts publish "${GITHUB_REF_NAME}" dist/client

  publish-android-rustore:
    name: Publish Android APK to RuStore
    runs-on: ubuntu-24.04
    needs: build-android-client
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Android release artifact
        uses: actions/download-artifact@v8
        with:
          name: client-release-android
          path: dist/client

      - name: Publish Android APK to RuStore
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          API="https://public-api.rustore.ru"
          PACKAGE_NAME="ru.cheenhub"
          APK_PATH="dist/client/cheenhub-${GITHUB_REF_NAME}-android.apk"

          if [[ -z "${RUSTORE_KEY_ID}" ]]; then
            echo "RUSTORE_KEY_ID is not configured." >&2
            exit 1
          fi

          if [[ -z "${RUSTORE_PRIVATE_KEY}" ]]; then
            echo "RUSTORE_PRIVATE_KEY is not configured." >&2
            exit 1
          fi

          if [[ ! -f "${APK_PATH}" ]]; then
            echo "Android release APK not found: ${APK_PATH}" >&2
            exit 1
          fi

          private_key_raw="${RUNNER_TEMP}/rustore-private-key"
          private_key_pem="${RUNNER_TEMP}/rustore-private-key.pem"
          trap 'rm -f "${private_key_raw}" "${private_key_pem}"' EXIT

          echo "::group::Authenticate in RuStore"

          timestamp="$(date -u '+%Y-%m-%dT%H:%M:%S.%3N+00:00')"

          if ! printf '%s' "${RUSTORE_PRIVATE_KEY}" \
            | tr -d '\r\n ' \
            | base64 --decode > "${private_key_raw}"
          then
            echo "RUSTORE_PRIVATE_KEY is not valid Base64." >&2
            exit 1
          fi

          if ! openssl pkey \
            -inform DER \
            -in "${private_key_raw}" \
            -out "${private_key_pem}" 2>/dev/null
          then
            if ! openssl pkey \
              -in "${private_key_raw}" \
              -out "${private_key_pem}" 2>/dev/null
            then
              echo "Unable to parse the RuStore RSA private key." >&2
              exit 1
            fi
          fi

          signature="$(
            printf '%s' "${RUSTORE_KEY_ID}${timestamp}" \
              | openssl dgst -sha512 -sign "${private_key_pem}" \
              | base64 -w0
          )"

          auth_response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              "${API}/public/auth/" \
              --header "Content-Type: application/json" \
              --data "$(
                jq -n \
                  --arg keyId "${RUSTORE_KEY_ID}" \
                  --arg timestamp "${timestamp}" \
                  --arg signature "${signature}" \
                  '{
                    keyId: $keyId,
                    timestamp: $timestamp,
                    signature: $signature
                  }'
              )"
          )"

          if [[ "$(jq -r '.code // empty' <<< "${auth_response}")" != "OK" ]]; then
            echo "RuStore authentication failed." >&2
            jq '{code, message, timestamp}' <<< "${auth_response}" >&2 || true
            exit 1
          fi

          token="$(jq -r '.body.jwe // empty' <<< "${auth_response}")"
          if [[ -z "${token}" ]]; then
            echo "RuStore did not return a JWE token." >&2
            exit 1
          fi
          echo "::add-mask::${token}"

          echo "::endgroup::"

          echo "::group::Check for an existing RuStore draft"

          versions_response="$(
            curl --fail-with-body --silent --show-error \
              "${API}/public/v1/application/${PACKAGE_NAME}/version?versionStatuses=DRAFT&page=0&size=20" \
              --header "Public-Token: ${token}"
          )"

          if [[ "$(jq -r '.code // empty' <<< "${versions_response}")" != "OK" ]]; then
            echo "Failed to query RuStore versions." >&2
            jq '{code, message, timestamp}' <<< "${versions_response}" >&2 || true
            exit 1
          fi

          draft_count="$(jq -r '.body.totalElements // 0' <<< "${versions_response}")"
          if (( draft_count > 0 )); then
            echo "RuStore already contains a DRAFT version for ${PACKAGE_NAME}." >&2
            echo "Finish or delete the existing draft in RuStore Console, then rerun this job." >&2
            jq '.body.content[] | {versionId, versionName, versionCode, versionStatus}' \
              <<< "${versions_response}" >&2 || true
            exit 1
          fi

          echo "::endgroup::"

          echo "::group::Create RuStore draft"

          version_name="${GITHUB_REF_NAME#v}"
          draft_response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              "${API}/public/v1/application/${PACKAGE_NAME}/version" \
              --header "Public-Token: ${token}" \
              --header "Content-Type: application/json" \
              --data "$(
                jq -n \
                  --arg whatsNew "Версия ${version_name}" \
                  '{
                    appType: "MAIN",
                    publishType: "INSTANTLY",
                    partialValue: 100,
                    whatsNew: $whatsNew
                  }'
              )"
          )"

          if [[ "$(jq -r '.code // empty' <<< "${draft_response}")" != "OK" ]]; then
            echo "Failed to create a RuStore draft." >&2
            jq '{code, message, timestamp}' <<< "${draft_response}" >&2 || true
            exit 1
          fi

          version_id="$(jq -r '
            if (.body | type) == "number" then
              .body
            elif .content.versionId? != null then
              .content.versionId
            elif .body.versionId? != null then
              .body.versionId
            else
              empty
            end
          ' <<< "${draft_response}")"
          if [[ -z "${version_id}" ]]; then
            echo "RuStore did not return versionId for the new draft." >&2
            exit 1
          fi

          echo "Created RuStore draft ${version_id}."
          echo "::endgroup::"

          echo "::group::Upload APK to RuStore"

          upload_response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              "${API}/public/v1/application/${PACKAGE_NAME}/version/${version_id}/apk?isMainApk=true&servicesType=Unknown" \
              --header "Public-Token: ${token}" \
              --form "file=@${APK_PATH}"
          )"

          if [[ "$(jq -r '.code // empty' <<< "${upload_response}")" != "OK" ]]; then
            echo "Failed to upload APK to RuStore." >&2
            jq '{code, message, timestamp}' <<< "${upload_response}" >&2 || true
            exit 1
          fi

          echo "::endgroup::"

          echo "::group::Send RuStore draft to moderation"

          moderation_response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              "${API}/public/v1/application/${PACKAGE_NAME}/version/${version_id}/commit?priorityUpdate=0" \
              --header "Public-Token: ${token}"
          )"

          if [[ "$(jq -r '.code // empty' <<< "${moderation_response}")" != "OK" ]]; then
            echo "Failed to send RuStore draft to moderation." >&2
            jq '{code, message, timestamp}' <<< "${moderation_response}" >&2 || true
            exit 1
          fi

          echo "RuStore version ${version_id} was sent to moderation."
          echo "::endgroup::"

  publish-dev-release:
    name: Publish rolling development release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build-backend
      - build-web
      - build-windows-client
      - build-linux-client
      - build-android-client

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download development release assets
        uses: actions/download-artifact@v8
        with:
          pattern: "*-release-*"
          path: dist/dev
          merge-multiple: true

      - name: Validate development release assets
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=(
            "cheenhub-backend-dev.docker-image.tar.gz"
            "cheenhub-web-dev.docker-image.tar.gz"
            "cheenhub-dev-windows-x64-setup.exe"
            "cheenhub-dev-linux-x64.deb"
            "cheenhub-dev-linux-x64.AppImage"
            "cheenhub-dev-android.apk"
          )
          for asset in "${expected_assets[@]}"; do
            if [[ ! -f "dist/dev/${asset}" ]]; then
              echo "Development release asset is missing: ${asset}." >&2
              exit 1
            fi
          done

          actual_count="$(find dist/dev -maxdepth 1 -type f | wc -l)"
          if [[ "${actual_count}" -ne "${#expected_assets[@]}" ]]; then
            echo "Development release contains ${actual_count} assets; expected ${#expected_assets[@]}." >&2
            find dist/dev -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Update development tag and release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git tag --force dev "${GITHUB_SHA}"
          git push --force origin refs/tags/dev

          release_notes="Automatically built from commit ${GITHUB_SHA} on the main branch."
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev \
              --title "Development build" \
              --notes "${release_notes}" \
              --prerelease \
              --latest=false \
              --verify-tag
          else
            gh release create dev \
              --title "Development build" \
              --notes "${release_notes}" \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

          gh release upload dev dist/dev/* --clobber
