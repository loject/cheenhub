name: Verify Windows release installer

on: workflow_dispatch

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: "1.99.1"
  DIOXUS_CLI_VERSION: "0.8.0-alpha.3"
  DIOXUS_WINDOWS_SHA256: "ff835a79d17f704d626077e4d8e02942789080f87190e10a3a4cfa6cd3ecad14"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  CHEENHUB_DOMAIN: ${{ vars.CHEENHUB_DOMAIN || 'cheenhub.ru' }}
  CHEENHUB_BASE_URL: ${{ vars.CHEENHUB_BASE_URL || 'https://cheenhub.ru' }}
  CHEENHUB_REALTIME_CERT_SHA256: ${{ vars.CHEENHUB_REALTIME_CERT_SHA256 || '' }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      web-image: ${{ steps.images.outputs.web }}
      app-version: ${{ steps.app-version.outputs.version }}
      release-tag: ${{ steps.app-version.outputs.release-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repo}/backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repo}/web" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        id: app-version
        shell: bash
        run: |
          release_tag="$(cargo run --quiet -p xtask -- release-version print-tag)"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${release_tag}"
            artifact_tag="${GITHUB_REF_NAME}"
            if [[ "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
              echo "Release tag ${GITHUB_REF_NAME} must match workspace version ${release_tag}." >&2
              exit 1
            fi
          else
            version="${release_tag}-${GITHUB_SHA::7}"
            artifact_tag="dev"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release-tag=${artifact_tag}" >> "$GITHUB_OUTPUT"

      - name: Validate and export release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cargo run --quiet --locked -p xtask -- release-notes export "${GITHUB_REF_NAME}" dist/release-notes

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: dist/release-notes/*
          if-no-files-found: error

  build-windows-client:
    name: Build Windows client installers
    runs-on: windows-2025
    needs: prepare
    env:
      CHEENHUB_APP_VERSION: ${{ needs.prepare.outputs.app-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN

      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install MSYS2 build tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make pkgconf nasm diffutils perl xz
          path-type: inherit

      - name: Add MSYS2 tools to PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $linker = (Get-Command link.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if (-not $env:VCToolsInstallDir -or -not $linker.StartsWith($env:VCToolsInstallDir, [StringComparison]::OrdinalIgnoreCase)) {
            throw "The selected linker is not from the configured MSVC toolchain: $linker"
          }
          $msvcBin = Split-Path -Parent $linker
          $msysBin = Join-Path $env:MSYS2_LOCATION 'usr\bin'
          if (-not (Test-Path (Join-Path $msysBin 'make.exe'))) { throw "MSYS2 make not found in $msysBin" }
          $msysBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $msvcBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Windows build tools
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $linker = (Get-Command link.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          Write-Host "Selected linker: $linker"
          if (-not $env:VCToolsInstallDir -or -not $linker.StartsWith($env:VCToolsInstallDir, [StringComparison]::OrdinalIgnoreCase)) {
            throw "The selected linker is not from the configured MSVC toolchain."
          }
          foreach ($tool in @('sh.exe', 'make.exe', 'cygpath.exe', 'nasm.exe', 'pkgconf.exe')) {
            $command = Get-Command $tool -CommandType Application -ErrorAction Stop | Select-Object -First 1
            Write-Host "Selected ${tool}: $($command.Source)"
            if ($command.Source -ine (Join-Path $env:MSYS2_LOCATION "usr\bin\$tool")) {
              throw "The selected $tool is not from the configured MSYS2 installation."
            }
          }

      - name: Install Dioxus CLI from official release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'dx-windows.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'dioxus-cli'
          $url = "https://github.com/DioxusLabs/dioxus/releases/download/v$env:DIOXUS_CLI_VERSION/dx-x86_64-pc-windows-msvc.zip"
          Write-Host "Downloading Dioxus CLI $env:DIOXUS_CLI_VERSION for Windows x64"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:DIOXUS_WINDOWS_SHA256) {
            throw "Dioxus CLI archive SHA256 mismatch: expected $env:DIOXUS_WINDOWS_SHA256, received $actual."
          }
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $binary = @(Get-ChildItem -Path $destination -Recurse -Filter dx.exe)
          if ($binary.Count -ne 1) {
            throw "Expected exactly one dx.exe in the official Dioxus archive."
          }
          $version = & $binary[0].FullName --version
          $expectedVersion = '^dioxus ' + [regex]::Escape($env:DIOXUS_CLI_VERSION) + '(?: \([^)]*\))?$'
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -notmatch $expectedVersion) {
            throw "Unexpected Dioxus CLI version: $version"
          }
          Write-Host $version
          $binary[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate release version
        shell: pwsh
        run: cargo run --quiet -p xtask -- release-version check

      - name: Fetch Rust dependencies for offline FFmpeg cache cleanup
        shell: pwsh
        run: cargo fetch --locked --target x86_64-pc-windows-msvc

      - name: Build static FFmpeg
        shell: pwsh
        run: |
          cargo run --locked -p xtask -- build-ffmpeg
          if ($LASTEXITCODE -ne 0) { throw "Static FFmpeg build failed." }

      - name: Upload FFmpeg configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-ffmpeg-config-diagnostics
          path: |
            target/ffmpeg-build/ffmpeg-build/ffbuild/config.log
            target/ffmpeg-build/ffmpeg-static/lib/pkgconfig/vpl.pc
          if-no-files-found: warn

      - name: Test native video codec linkage
        shell: pwsh
        env:
          _LINK_: "/STACK:16777216"
        run: cargo test --locked -p cheenhub_video_codec --target x86_64-pc-windows-msvc --profile desktop-release --config 'profile.desktop-release.inherits="release"' --config 'profile.desktop-release.strip=false'

      - name: Build Windows installers
        shell: pwsh
        env:
          # ffmpeg-sys-next запускает bindgen в главном потоке build-скрипта.
          # Аргумент MSVC действует и на host-сборку при cargo build --target.
          _LINK_: "/STACK:16777216"
        run: |
          $ErrorActionPreference = 'Stop'
          dx bundle --windows --target x86_64-pc-windows-msvc --package cheenhub_client --bin cheenhub --release --no-default-features --features desktop,windows --package-types nsis --out-dir dist/windows/raw
          if ($LASTEXITCODE -ne 0) { throw "Windows Dioxus bundle failed." }
          $payload = Get-ChildItem -Path dist/windows/raw -Recurse -Filter *.exe | Sort-Object FullName | Select-Object -First 1
          if (-not $payload) {
            throw "Dioxus Windows NSIS installer was not found in dist/windows/raw."
          }
          $env:CHEENHUB_INSTALLER_PAYLOAD = $payload.FullName
          $env:CHEENHUB_INSTALLER_PAYLOAD_NAME = $payload.Name
          # Совпадение target и профиля с dx позволяет повторно использовать внешние зависимости.
          cargo build -p cheenhub_client --bin cheenhub_installer --target x86_64-pc-windows-msvc --profile desktop-release --config 'profile.desktop-release.inherits="release"' --config 'profile.desktop-release.strip=false' --no-default-features --features desktop,windows
          if ($LASTEXITCODE -ne 0) { throw "Windows installer wrapper build failed." }
          New-Item -ItemType Directory -Force dist/windows/installer | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/desktop-release/cheenhub_installer.exe dist/windows/installer/cheenhub-installer.exe

      - name: Normalize Windows release assets
        shell: pwsh
        run: |
          cargo run --quiet -p xtask -- release-artifacts collect windows dist/windows/installer dist/client "${{ needs.prepare.outputs.release-tag }}"
          if ($LASTEXITCODE -ne 0) { throw "Windows release artifact collection failed." }

      - name: Publish Windows release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: cargo run --quiet -p xtask -- release-artifacts publish $env:GITHUB_REF_NAME dist/client

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v6
        with:
          name: client-release-windows
          path: dist/client/*
          if-no-files-found: error
