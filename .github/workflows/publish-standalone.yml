name: Publish standalone backend preview

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: standalone-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CHEENHUB_BASE_URL: ${{ vars.CHEENHUB_BASE_URL || 'https://cheenhub.ru' }}
  CHEENHUB_REALTIME_CERT_SHA256: ${{ vars.CHEENHUB_REALTIME_CERT_SHA256 || '' }}

jobs:
  publish:
    name: Build and push standalone preview
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate frontend configuration
        shell: bash
        run: |
          if ! grep -q 'AS backend-standalone-runtime' Dockerfile; then
            echo 'Dockerfile must contain backend-standalone-runtime.' >&2
            exit 1
          fi

      - name: Resolve image references and version
        id: release
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          version="$(cargo run --quiet -p xtask -- release-version print-tag)"
          echo "standalone=ghcr.io/${repo}/backend-standalone" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${repo}/backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repo}/web" >> "$GITHUB_OUTPUT"
          echo "app-version=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push standalone image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backend-standalone-runtime
          push: true
          tags: ${{ steps.release.outputs.standalone }}:sha-${{ github.sha }}
          build-args: |
            CHEENHUB_BASE_URL=${{ env.CHEENHUB_BASE_URL }}
            CHEENHUB_APP_VERSION=${{ steps.release.outputs.app-version }}
            CHEENHUB_REALTIME_CERT_SHA256=${{ env.CHEENHUB_REALTIME_CERT_SHA256 }}
          cache-from: |
            type=registry,ref=${{ steps.release.outputs.backend }}:buildcache
            type=registry,ref=${{ steps.release.outputs.web }}:buildcache

      - name: Show published image
        shell: bash
        run: echo "Published ${{ steps.release.outputs.standalone }}:sha-${{ github.sha }}"
