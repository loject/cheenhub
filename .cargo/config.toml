# Инкрементальная компиляция выключена намеренно: кэш в target/*/debug/incremental
# разрастался до 38 ГБ и никогда не чистился. Пересборка зависимостей от этого
# не зависела — она определяется fingerprint'ами cargo, а не incremental.
[build]
incremental = false

[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis"]

# Android NDK: статическая C++ runtime требует явной линковки libc++abi.
[target.'cfg(target_os = "android")']
rustflags = ["-C", "link-arg=-lc++abi"]

[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
FFMPEG_DIR = { value = "crates/video-codec/vendor/ffmpeg-static", relative = true }
