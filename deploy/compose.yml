name: cheenhub

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    image: ${CHEENHUB_BACKEND_IMAGE_REF:?CHEENHUB_BACKEND_IMAGE_REF is required}
    restart: "no"
    env_file:
      - ../.env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["cheenhub_migrations", "up"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ${CHEENHUB_BACKEND_IMAGE_REF:?CHEENHUB_BACKEND_IMAGE_REF is required}
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3000
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/fcm-service-account.json
      WEBTRANSPORT_TLS_CERT_PATH: /etc/letsencrypt/live/cheenhub.ru/fullchain.pem
      WEBTRANSPORT_TLS_KEY_PATH: /etc/letsencrypt/live/cheenhub.ru/privkey.pem
      WEBTRANSPORT_TLS_RELOAD_INTERVAL_SECONDS: ${WEBTRANSPORT_TLS_RELOAD_INTERVAL_SECONDS:-5}
      CHEENHUB_METRICS_PROXY_URL: http://metrics-proxy:9100
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - ./secrets/firebase-service-account.json:/run/secrets/fcm-service-account.json:ro
    expose:
      - "3000/tcp"
      - "3000/udp"
    ports:
      - "443:3000/udp"
    depends_on:
      migrate:
        condition: service_completed_successfully
      metrics-proxy:
        condition: service_started
    networks:
      - default
      - host-metrics

  metrics-proxy:
    image: ${CHEENHUB_BACKEND_IMAGE_REF:?CHEENHUB_BACKEND_IMAGE_REF is required}
    restart: unless-stopped
    command: ["cheenhub_metrics_proxy"]
    environment:
      CHEENHUB_METRICS_APP_SERVICES: backend,web
      CHEENHUB_METRICS_DATABASE_SERVICE: db
      CHEENHUB_METRICS_PROXY_ADDRESS: 0.0.0.0:9100
      RUST_LOG: cheenhub_metrics_proxy=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - host-metrics

  web:
    image: ${CHEENHUB_WEB_IMAGE_REF:?CHEENHUB_WEB_IMAGE_REF is required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done

volumes:
  postgres-data:
  letsencrypt:
    external: true
    name: cheenhub_letsencrypt
  certbot-webroot:

networks:
  host-metrics:
    internal: true
